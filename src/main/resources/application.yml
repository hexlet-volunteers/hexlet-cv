spring:
  profiles:
    active: dev  # "prod" если продакшен

  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100

  app:
    pricing:
      scale: 2
      free-threshold: 0.01
      max-discount: 100
      min-price: 0

  jackson:
    serialization:
      write-dates-as-timestamps: false

  jpa:
    show-sql: false
    generate-ddl: true
    hibernate:
      ddl-auto: validate
    output:
 #     ansi:
 #       enabled: always

rsa:
  private-key: ${RSA_PRIVATE_KEY_PATH}
  public-key: ${RSA_PUBLIC_KEY_PATH}

server:
  error:
    include-message: never
    include-binding-errors: never
    include-exception: false

app:
  audit:
    # Читается напрямую logback-spring.xml, аппендер поднимается только в профиле prod
    file:
      path: logs/audit.log
    alerts:
      enabled: true
      window: 5m
      failure-threshold: 10
      max-tracked-keys: 10000

  security:
    cookie:
      access:
        httpOnly: true
        secure: true
        sameSite: Strict  # только прямые
        maxAgeSeconds: 900       # 15 минут
      refresh:
        httpOnly: true
        secure: true
        sameSite: Lax # можно с других сайтов
        maxAgeSeconds: 2592000   # 30 дней
    jwt:
      access-token-validity-seconds: 900        # 15 минут
      refresh-token-validity-seconds: 2592000   # 30 дней
      issuer: hexlet-cv
      audience: hexlet-cv-frontend
      enforce-session-claims: false             # → true через 30 дней после релиза, см. раздел 5
      refresh-race-grace-seconds: 0             # >0 — не казнить семейство при гонке, см. 3.5
      cleanup-cron: "0 17 3 * * *"

logging:
  level:
    io.hexlet.cv.audit: info
